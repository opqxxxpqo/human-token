[package]
name = "human-token"
version = "0.1.0"
description = "Visualize keyboard/mouse activity as token consumption"
edition = "2021"
rust-version = "1.77"

[lib]
name = "human_token_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rdev = "0.5"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
parking_lot = "0.12"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
